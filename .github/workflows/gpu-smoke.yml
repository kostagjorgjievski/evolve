name: GPU smoke test

# Manual check that the self-hosted GPU runner works: it picks a free GPU,
# shows nvidia-smi, and runs a tiny PyTorch CUDA computation on it.
# Run from the Actions tab -> GPU smoke test -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      gpus:
        description: "How many free GPUs to request"
        default: "1"

concurrency:
  group: gpu-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.actor == github.repository_owner
    runs-on: [self-hosted, gpu]
    timeout-minutes: 45
    steps:
      # sp-1 sits behind a campus network where git over github.com often
      # times out, while api.github.com works. Try a quick shallow fetch and
      # fall back to the REST tarball instead of actions/checkout's long retries.
      - name: Get code
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          find . -mindepth 1 -delete
          git_fetch() {
            git init -q . &&
            git -c "http.extraheader=AUTHORIZATION: bearer ${TOKEN}" \
              -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=20 \
              fetch -q --depth 1 --no-tags "https://github.com/${REPO}.git" "${SHA}" &&
            git checkout -q FETCH_HEAD
          }
          if timeout 60 bash -c "$(declare -f git_fetch); git_fetch"; then
            echo "Got ${SHA} with git"
          else
            echo "git unavailable from $(hostname); downloading tarball via api.github.com"
            find . -mindepth 1 -delete
            curl -fsSL --retry 5 --retry-delay 10 --max-time 300 \
              -H "Authorization: Bearer ${TOKEN}" \
              "https://api.github.com/repos/${REPO}/tarball/${SHA}" \
              | tar -xz --strip-components=1
            echo "Got ${SHA} as tarball"
          fi
          test -f .github/scripts/gpu-pick.sh
      - name: Pick free GPU(s)
        run: bash .github/scripts/gpu-pick.sh "${{ inputs.gpus }}"
      - name: Show GPUs
        run: |
          echo "CUDA_VISIBLE_DEVICES=$CUDA_VISIBLE_DEVICES"
          nvidia-smi
      # Uses the image's own Python (no download from GitHub) and torch 2.6.0,
      # whose PyPI wheel bundles CUDA 12.4, matching sp-1's driver (550).
      # Output is tee'd so a failure's last lines show up as an annotation.
      - name: PyTorch CUDA check
        env:
          UV_INDEX_URL: ${{ vars.GPU_PIP_INDEX_URL }}
          UV_PYTHON_PREFERENCE: only-system
        run: |
          export PATH="$HOME/.local/$(uname -m)/bin:$HOME/.local/bin:$PATH"
          cat > /tmp/smoke.py <<'EOF'
          import torch
          print("torch", torch.__version__, "built for CUDA", torch.version.cuda)
          assert torch.cuda.is_available(), "CUDA not available to PyTorch"
          n = torch.cuda.device_count()
          print(f"{n} visible GPU(s):", [torch.cuda.get_device_name(i) for i in range(n)])
          x = torch.randn(2048, 2048, device="cuda")
          print("matmul ok, checksum", float((x @ x).sum()))
          EOF
          set +e
          uv run --no-project --python python3 --with "torch==2.6.0" python /tmp/smoke.py 2>&1 | tee /tmp/smoke.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error title=PyTorch CUDA check::$(tail -n 15 /tmp/smoke.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          fi
          exit "$rc"
      - name: Release GPU lock
        if: always()
        # Works even if "Get code" failed: then no GPU was picked and there is
        # nothing to release, so a missing script is not an error.
        run: |
          if [ -f .github/scripts/gpu-release.sh ]; then
            bash .github/scripts/gpu-release.sh
          elif [ -n "${EVOLVETS_GPU_LOCKS:-}" ]; then
            for lock in $EVOLVETS_GPU_LOCKS; do
              case "$lock" in */evolvets-gpu-*.lock) rm -rf "$lock" && echo "Released $lock" ;; esac
            done
          else
            echo "No GPU locks held."
          fi
