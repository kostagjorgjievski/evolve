name: Gate 1 dev report

# Builds the dev report from a completed tune run's ledger on the lab node and
# publishes it (dev numbers only: no sealed data is involved) as the job summary
# and an artifact. Also checks that the run's recorded git commit is a real
# commit of this repository, as the sealed plan requires (TASK_012).

on:
  workflow_dispatch:
    inputs:
      tune_run_id:
        description: Tune run id (empty = the newest run in the ledger directory)
        default: ""
      bootstrap_seed:
        description: Bootstrap seed
        default: "0"
      probe_run_ids:
        description: Space-separated learned-updater probe run ids (TASK_014), empty for none
        default: ""

concurrency:
  group: gate1-dev-report
  cancel-in-progress: false

jobs:
  report:
    if: github.actor == github.repository_owner
    runs-on: [self-hosted, gpu]
    timeout-minutes: 60
    env:
      UV_INDEX_URL: ${{ vars.GPU_PIP_INDEX_URL }}
      UV_PYTHON_PREFERENCE: only-system
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - name: Get code
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          find . -mindepth 1 -delete
          # Dev-only workflow: a tarball is fine here (the report is built from the
          # ledger, not from this checkout), unlike the sealed workflows.
          if git init -q . &&
            timeout 90 git -c "http.extraheader=AUTHORIZATION: bearer ${TOKEN}" \
              -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=20 \
              fetch -q --depth 1 --no-tags "https://github.com/${REPO}.git" "${SHA}" &&
            git checkout -q FETCH_HEAD; then
            echo "Got ${SHA} with git"
          else
            echo "git unavailable from $(hostname); downloading tarball via api.github.com"
            find . -mindepth 1 -delete
            curl -fsSL --retry 5 --retry-delay 10 --max-time 300 \
              -H "Authorization: Bearer ${TOKEN}" \
              "https://api.github.com/repos/${REPO}/tarball/${SHA}" \
              | tar -xz --strip-components=1
          fi
          test -f .github/scripts/gpu-env.sh
      - name: Paths
        run: |
          set -euo pipefail
          base="${EVOLVETS_DATA:-/data}/evolve"
          {
            echo "LEDGER_ROOT=$base/ledgers"
            echo "VENV=$base/venv-dev"
          } >> "$GITHUB_ENV"
      - name: Python environment from uv.lock
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash .github/scripts/run-logged.sh "python env" bash .github/scripts/gpu-env.sh dev "$VENV"
      - name: Pick the run and check its commit
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_INPUT: ${{ inputs.tune_run_id }}
          PROBE_IDS: ${{ inputs.probe_run_ids }}
        run: |
          set -euo pipefail
          run_id="$RUN_INPUT"
          if [ -z "$run_id" ]; then
            run_id="$(ls -1t "$LEDGER_ROOT" | grep '^gate1-tune-' | head -1)"
          fi
          test -n "$run_id"
          echo "RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "tune run: $run_id"
          commit="$("$VENV/bin/python" -I - "$LEDGER_ROOT/$run_id/main.jsonl" <<'PY'
          import json, re, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              first = handle.readline()
          found = re.findall(r'"git_commit"\s*:\s*"([0-9a-f]{40})"', first)
          print(found[0] if found else "")
          PY
          )"
          echo "recorded git commit: ${commit:-NOT FOUND}"
          test -n "$commit"
          status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 \
            -H "Authorization: Bearer ${TOKEN}" \
            "https://api.github.com/repos/${REPO}/commits/${commit}" || true)"
          echo "commit lookup on GitHub: HTTP $status"
          if [ "$status" = "200" ]; then
            echo "COMMIT_OK: the recorded commit exists in the repository"
          else
            echo "::warning title=tarball commit?::The recorded commit is not a commit of this repository. The tune run may need a redo from a git checkout before the sealed run."
          fi
          echo "PROBE_IDS=$PROBE_IDS" >> "$GITHUB_ENV"
          for probe in $PROBE_IDS; do
            test -f "$LEDGER_ROOT/$probe/main.jsonl" || { echo "missing probe run $probe"; exit 1; }
            pc="$(head -n1 "$LEDGER_ROOT/$probe/main.jsonl" | grep -oE '"git_commit" *: *"[0-9a-f]{40}"' | grep -oE '[0-9a-f]{40}' || true)"
            ps="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 \
              -H "Authorization: Bearer ${TOKEN}" \
              "https://api.github.com/repos/${REPO}/commits/${pc}" || true)"
            echo "probe run $probe: recorded git commit ${pc:-NOT FOUND}, GitHub lookup HTTP $ps"
          done
      - name: Build the report
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p out
          probe_args=()
          for probe in $PROBE_IDS; do probe_args+=(--probe-run "$probe"); done
          bash .github/scripts/run-logged.sh "gate1 report" "$VENV/bin/evolvets" gate1 report \
            --ledger-root "$LEDGER_ROOT" --run "$RUN_ID" \
            --bootstrap-seed "${{ inputs.bootstrap_seed }}" "${probe_args[@]}" --out out/gate1-dev-report.md
          wc -l out/gate1-dev-report.md
          cat out/gate1-dev-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the report as notice annotations (dev numbers only)
        run: |
          # annotations are length-limited, so publish the report in numbered chunks
          "$VENV/bin/python" -I - out/gate1-dev-report.md <<'PY'
          import sys
          from urllib.parse import quote
          text = open(sys.argv[1], encoding="utf-8").read()
          chunks, current = [], ""
          for line in text.splitlines(keepends=True):
              if len(current) + len(line) > 3000 and current:
                  chunks.append(current)
                  current = ""
              current += line
          chunks.append(current)
          for number, chunk in enumerate(chunks, 1):
              body = chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::notice title=gate1-dev-report {number:02d}/{len(chunks):02d}::{body}")
          PY
      - name: Upload the report (dev numbers only)
        uses: actions/upload-artifact@v4
        with:
          name: gate1-dev-report
          path: out/gate1-dev-report.md
          retention-days: 90
