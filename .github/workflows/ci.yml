name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Set up Python
        run: uv python install 3.11
      - name: Install
        run: uv sync --locked --group dev  # never the fm-* GPU groups (TASK_009)
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Import contracts
        run: uv run lint-imports
      - name: Import contracts must reject violations
        run: |
          bash .github/scripts/import-probe.sh 'import evolvets.arena.sealed' \
            'Agent-editable packages never reach sealed or live data'
          bash .github/scripts/import-probe.sh 'import evolvets.cache' \
            'Agent-editable packages never reach targets, oracles or raw forecasts'
          bash .github/scripts/import-probe.sh 'import evolvets.foundation' \
            'Agent-editable packages never reach targets, oracles or raw forecasts'
          bash .github/scripts/import-probe.sh 'import evolvets.arena.replay' \
            'Updaters see data only through the replay loop'
      - name: Tests
        run: uv run pytest
