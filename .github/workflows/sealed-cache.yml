name: Sealed cache (W2)

# Builds sealed forecast caches on the lab node's persistent volume. Owner-only,
# manual dispatch only. Prints only the CLI's own OK/FAIL lines. Nothing sealed
# is written under the checkout or the public cache roots, uploaded or printed.

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Sealed pool
        type: choice
        options: [etth1, ecl, synthetic-sealed]
      model:
        description: simple (CPU) or a foundation model (GPU)
        type: choice
        options: [simple, chronos2, tirex, timesfm25]
      batch_size:
        description: Contexts per adapter call
        default: "32"
      gpus:
        description: GPUs for a foundation model
        default: "1"

concurrency:
  group: sealed-cache-${{ inputs.dataset }}
  cancel-in-progress: false

jobs:
  build:
    if: github.actor == github.repository_owner
    runs-on: [self-hosted, gpu]
    timeout-minutes: 480
    env:
      DATASET: ${{ inputs.dataset }}
      MODEL: ${{ inputs.model }}
      BATCH_SIZE: ${{ inputs.batch_size }}
      UV_INDEX_URL: ${{ vars.GPU_PIP_INDEX_URL }}
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - name: Get code (git only, no tarball fallback)
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          find . -mindepth 1 -delete
          git init -q .
          timeout 120 git -c "http.extraheader=AUTHORIZATION: bearer ${TOKEN}" \
            -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=20 \
            fetch -q --depth 1 --no-tags "https://github.com/${REPO}.git" "${SHA}"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SHA}"
          test -f .github/scripts/gpu-pick.sh
      - name: Pick free GPU(s)
        if: inputs.model != 'simple'
        run: bash .github/scripts/gpu-pick.sh "${{ inputs.gpus }}"
      - name: Paths and environment group
        run: |
          set -euo pipefail
          umask 077
          base="${EVOLVETS_DATA:-/data}/evolve"
          install -d -m 700 "$base/sealed" "$base/sealed/data" "$base/sealed/cache"
          case "$MODEL" in
            simple)    group=dev ;;
            chronos2)  group=fm-chronos ;;
            tirex)     group=fm-tirex ;;
            timesfm25) group=fm-timesfm ;;
            *) echo "unknown model $MODEL"; exit 1 ;;
          esac
          {
            echo "SEALED_DATA=$base/sealed/data"
            echo "SEALED_CACHE=$base/sealed/cache"
            echo "VENV=$base/venv-$group"
            echo "GROUP=$group"
          } >> "$GITHUB_ENV"
          if [ "$MODEL" = "simple" ]; then echo "CUDA_VISIBLE_DEVICES=" >> "$GITHUB_ENV"; fi
      - name: Python environment from uv.lock
        run: |
          export PATH="$HOME/.local/$(uname -m)/bin:$HOME/.local/bin:$PATH"
          bash .github/scripts/run-logged.sh "python env" bash .github/scripts/gpu-env.sh "$GROUP" "$VENV"
      - name: Real data into the sealed data root (verify, else fetch and prepare)
        if: inputs.dataset != 'synthetic-sealed'
        run: |
          umask 077
          export PATH="$HOME/.local/$(uname -m)/bin:$HOME/.local/bin:$PATH"
          ev="$VENV/bin/evolvets"
          if ! "$ev" data verify "$DATASET" --data-root "$SEALED_DATA" --manifest-dir data/manifests; then
            bash .github/scripts/run-logged.sh "data fetch" "$ev" data fetch "$DATASET" \
              --data-root "$SEALED_DATA" --manifest-dir data/manifests
            bash .github/scripts/run-logged.sh "data prepare" "$ev" data prepare "$DATASET" \
              --data-root "$SEALED_DATA" --manifest-dir data/manifests
            bash .github/scripts/run-logged.sh "data verify" "$ev" data verify "$DATASET" \
              --data-root "$SEALED_DATA" --manifest-dir data/manifests
          fi
      - name: Build the sealed simple cache
        if: inputs.model == 'simple'
        run: |
          umask 077
          export PATH="$HOME/.local/$(uname -m)/bin:$HOME/.local/bin:$PATH"
          bash .github/scripts/run-logged.sh "sealed build-cache" "$VENV/bin/evolvets" sealed build-cache \
            "$DATASET" --data-root "$SEALED_DATA" --manifest-dir data/manifests \
            --sealed-cache-root "$SEALED_CACHE"
      - name: Smoke check on the GPU
        if: inputs.model != 'simple'
        run: |
          export PATH="$HOME/.local/$(uname -m)/bin:$HOME/.local/bin:$PATH"
          bash .github/scripts/run-logged.sh "foundation smoke" "$VENV/bin/evolvets" foundation smoke \
            --model "$MODEL" --device cuda
      - name: Build the sealed foundation cache
        if: inputs.model != 'simple'
        run: |
          umask 077
          export PATH="$HOME/.local/$(uname -m)/bin:$HOME/.local/bin:$PATH"
          bash .github/scripts/run-logged.sh "sealed build-foundation-cache" "$VENV/bin/evolvets" \
            sealed build-foundation-cache "$DATASET" --model "$MODEL" --device cuda \
            --batch-size "$BATCH_SIZE" --data-root "$SEALED_DATA" --manifest-dir data/manifests \
            --sealed-cache-root "$SEALED_CACHE"
      - name: Release GPU lock
        if: always()
        run: |
          if [ -f .github/scripts/gpu-release.sh ]; then
            bash .github/scripts/gpu-release.sh
          else
            echo "No GPU locks held."
          fi
