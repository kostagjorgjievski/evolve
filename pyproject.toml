[project]
name = "evolvets"
version = "0.0.1"
description = "EvolveTS: self-evolution and self-improvement component of TimeSeries Code (TSCode)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
evolvets = "evolvets.runner.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pre-commit>=3.8",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evolvets"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["evolvets"]
warn_unused_configs = true
warn_return_any = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "evolvets.arena.*",
    "evolvets.ledger.*",
    "evolvets.cache.*",
    "evolvets.experts.*",
    "evolvets.foundation.*",  # models/ wrappers get their own non-strict override in TASK_009 PR C
    "evolvets.updater.interfaces",
]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
