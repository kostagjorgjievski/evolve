name: Gate 1 headroom scan tuning (synthetic scan datasets)

# Runs `evolvets gate1 tune` over the four headroom-scan datasets (TASK_015), one
# background piece per dataset, on the lab node that holds the scan caches. Ledgers go
# to the node's persistent volume (AGENTS.md 2.8). CPU work: it never touches a GPU.
# Owner-only, manual dispatch only. A piece that ended aborted may be re-dispatched
# alone through `datasets`; a piece that completed is never re-run.

on:
  workflow_dispatch:
    inputs:
      max_wall_seconds:
        description: Wall-clock budget of each piece in seconds (default two days)
        default: "172800"
      seed:
        description: Updater seed
        default: "0"
      datasets:
        description: Space-separated scan datasets to tune
        default: "synthetic-shift1 synthetic-shift2 synthetic-shift3 synthetic-wide"

concurrency:
  group: gate1-headroom-tune
  cancel-in-progress: false

jobs:
  headroom-tune:
    if: github.actor == github.repository_owner
    runs-on: [self-hosted, gpu]
    timeout-minutes: 3600
    env:
      UV_INDEX_URL: ${{ vars.GPU_PIP_INDEX_URL }}
      UV_PYTHON_PREFERENCE: only-system
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - name: Get code (clean checkout of this commit)
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          find . -mindepth 1 -delete
          git_fetch() {
            git init -q . &&
            git -c "http.extraheader=AUTHORIZATION: bearer ${TOKEN}" \
              -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=20 \
              fetch -q --depth 1 --no-tags "https://github.com/${REPO}.git" "${SHA}" &&
            git checkout -q FETCH_HEAD
          }
          if timeout 60 bash -c "$(declare -f git_fetch); git_fetch"; then
            echo "Got ${SHA} with git"
          else
            echo "::warning title=tarball checkout::git unavailable from $(hostname); using the tarball of ${SHA}"
            find . -mindepth 1 -delete
            curl -fsSL --retry 5 --retry-delay 10 --max-time 300 \
              -H "Authorization: Bearer ${TOKEN}" \
              "https://api.github.com/repos/${REPO}/tarball/${SHA}" \
              | tar -xz --strip-components=1
            # current_git_commit needs a git checkout with no modified files
            git init -q . && git add -A >/dev/null && \
              git -c user.name=ci -c user.email=ci@example.invalid commit -q -m "tarball of ${SHA}"
          fi
      - name: Paths
        run: |
          set -euo pipefail
          base="${EVOLVETS_DATA:-/data}/evolve"
          mkdir -p "$base/ledgers"
          {
            echo "DATA_ROOT=$base/data"
            echo "CACHE_ROOT=$base/cache_store"
            echo "FM_ROOT=$base/foundation_cache"
            echo "LEDGER_ROOT=$base/ledgers"
            echo "VENV=$base/venv-dev"
          } >> "$GITHUB_ENV"
      - name: Python environment from uv.lock
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash .github/scripts/run-logged.sh "python env" bash .github/scripts/gpu-env.sh dev "$VENV"
      - name: Tune each dataset
        env:
          WALL: ${{ inputs.max_wall_seconds }}
          SEED: ${{ inputs.seed }}
          DATASETS: ${{ inputs.datasets }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          git status --porcelain
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          sha8="$(printf '%s' "${GITHUB_SHA}" | cut -c1-8)"
          mkdir -p logs
          declare -A pids ids
          for d in $DATASETS; do
            ids[$d]="gate1-scan-${d}-${stamp}-${sha8}"
            "$VENV/bin/evolvets" gate1 tune \
              --dataset "$d" --pool-spec simple --pool-spec simple+foundation \
              --run-id "${ids[$d]}" \
              --max-wall-seconds "$WALL" --seed "$SEED" \
              --ledger-root "$LEDGER_ROOT" --cache-root "$CACHE_ROOT" \
              --foundation-root "$FM_ROOT" --data-root "$DATA_ROOT" \
              --manifest-dir data/manifests > "logs/$d.log" 2>&1 &
            pids[$d]=$!
          done
          fail=0
          for d in $DATASETS; do
            code=0
            wait "${pids[$d]}" || code=$?
            tail -n 20 "logs/$d.log"
            if [ "$code" -eq 0 ] || [ "$code" -eq 2 ]; then
              echo "OK $d ${ids[$d]} exit $code (0 completed, 2 budget_exhausted)"
            else
              echo "FAIL $d ${ids[$d]} exit $code"
              fail=1
            fi
          done
          all=""
          for d in $DATASETS; do all="$all ${ids[$d]}"; done
          echo "TUNE_RUN_IDS=${all# }"
          ls "$LEDGER_ROOT" | tail -8
          exit "$fail"
