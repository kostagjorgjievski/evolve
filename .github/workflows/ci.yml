name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Set up Python
        run: uv python install 3.11
      - name: Install
        run: uv sync --locked --all-groups
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Import contracts (sealed/live isolation)
        run: uv run lint-imports
      - name: Import contracts must reject violations
        run: |
          probe=src/evolvets/updater/_violation_probe.py
          echo 'import evolvets.arena.sealed' > "$probe"
          # The step passes only if lint-imports exits non-zero AND reports
          # the sealed/live contract itself as BROKEN. Any other non-zero
          # exit (crash, missing config) must fail this step.
          set +e
          out=$(uv run lint-imports 2>&1)
          status=$?
          set -e
          rm "$probe"
          if [ "$status" -eq 0 ]; then
            echo "lint-imports accepted a forbidden import of evolvets.arena.sealed"
            printf '%s\n' "$out"
            exit 1
          fi
          if ! printf '%s\n' "$out" | grep -q 'Agent-editable packages never reach sealed or live data.*BROKEN'; then
            echo "lint-imports exited $status without reporting the sealed/live contract as BROKEN (crash or missing config?)"
            printf '%s\n' "$out"
            exit 1
          fi
          printf '%s\n' "$out" | grep 'Agent-editable packages never reach sealed or live data.*BROKEN'
          echo "OK: the sealed/live contract rejects violations"
      - name: Tests
        run: uv run pytest
