name: Agent - planner

# Wakes the planner agent when the developer has finished every active task
# and opens an issue titled "[agent:needs-plan] ...". The planner writes the
# next task spec as a PR, or escalates to a human at a research gate
# (docs/agents/planner.md).

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:

concurrency:
  group: agent-planner
  cancel-in-progress: false

jobs:
  guard:
    if: >-
      vars.AGENTS_PAUSED != 'true' && (
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.event.issue.title, '[agent:needs-plan]')
      )
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
      - id: guard
        env:
          GH_TOKEN: ${{ secrets.AGENTS_GH_TOKEN }}
          AGENTS_DAILY_RUN_CAP: ${{ vars.AGENTS_DAILY_RUN_CAP }}
        run: bash .github/scripts/agent-guard.sh

  plan:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.AGENTS_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AGENTS_GH_TOKEN }}
      - name: Git identity
        run: |
          git config user.name "evolvets-planner-agent"
          git config user.email "noreply@anthropic.com"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AGENTS_GH_TOKEN }}
          prompt: |
            You are the PLANNER agent for this repository. Read docs/agents/planner.md
            and follow it exactly.

            Trigger for this run: event ${{ github.event_name }}, issue #${{ github.event.issue.number }}.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 100
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
