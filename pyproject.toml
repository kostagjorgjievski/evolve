[project]
name = "evolvets"
version = "0.0.1"
description = "EvolveTS: self-evolution and self-improvement component of TimeSeries Code (TSCode)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
evolvets = "evolvets.runner.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pre-commit>=3.8",
    "import-linter>=2.0",
]
# TASK_009 PR C: one optional group per foundation model, each with its library
# and the pinned torch (2.6.* bundles CUDA 12.4, matching the lab GPU driver).
# Never add these to [project] dependencies or dev; CI installs only dev.
fm-chronos = [
    "chronos-forecasting>=2.0,<3",
    "torch==2.6.*",
    # chronos declares transformers>=4.41,<6, but 5.x imports through
    # torch.accelerator.current_accelerator(), which raises on a CPU-only
    # machine under torch 2.6 — and the adapters must also run on CPU.
    "transformers>=4.41,<5",
]
# TASK_009 PR C2: tirex-ts leaves torch unpinned (its base install has no
# torch bound), so the pinned torch resolves cleanly; the xlstm CUDA kernels
# live only in its extras and are not installed — the pure-torch backend runs
# on CPU and GPU alike.
fm-tirex = [
    "tirex-ts>=1.4,<2",
    "torch==2.6.*",
]
# TASK_009 PR C5: timesfm >= 3.0 is the first PyPI line with the TimesFM 2.5
# classes (the model card's "pip install from PyPI coming soon" note predates
# it). Its base install keeps torch as an extra (torch>=2.0) and pulls only
# numpy, huggingface-hub and safetensors, so the pinned torch resolves
# cleanly with no extra pins.
fm-timesfm = [
    "timesfm>=3.0,<4",
    "torch==2.6.*",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evolvets"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["evolvets"]
warn_unused_configs = true
warn_return_any = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "evolvets.arena.*",
    "evolvets.ledger.*",
    "evolvets.cache.*",
    "evolvets.experts.*",
    "evolvets.foundation.*",
    "evolvets.updater.interfaces",
    "evolvets.updater.baselines",
    # TASK_014 PR A: updater/learned (PR B appends loss_gate to it).
    "evolvets.updater.learned",
    # TASK_011: every new runner module joins the strict list (PR A: runs;
    # PR B: gate1_grids, gate1_tune; PR C1: gate1_report_data; PR C2: gate1_report).
    # TASK_012 PR A: gate1_sealed (split: plan first, run next).
    # TASK_014 PR C: gate1_probe; PR D: gate1_probe_data (split: data first,
    # rendering next).
    "evolvets.runner.runs",
    "evolvets.runner.gate1_grids",
    "evolvets.runner.gate1_tune",
    "evolvets.runner.gate1_probe",
    "evolvets.runner.gate1_probe_data",
    "evolvets.runner.gate1_report_data",
    "evolvets.runner.gate1_report",
    "evolvets.runner.gate1_sealed",
]
strict = true

[[tool.mypy.overrides]]
# The model wrappers in foundation/models/ call pretrained-model libraries
# that ship no type stubs and are absent from the dev environment mypy runs
# in (TASK_009 installs them per model in the fm-* groups). Definitions stay
# fully typed; only the calls into those libraries are relaxed. (The import
# errors are disabled per error code because per-module ignore_missing_imports
# no longer silences them on this mypy.)
module = ["evolvets.foundation.models", "evolvets.foundation.models.*"]
disallow_untyped_calls = false
warn_return_any = false
disable_error_code = ["import-not-found", "import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "foundation: needs a real foundation-model library (runs in the GPU workflow, not CI)",
]
